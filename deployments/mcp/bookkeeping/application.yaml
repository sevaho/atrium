---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mcp-bookkeeping
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/sevaho/atrium
    path: deployments/mcp/bookkeeping
    targetRevision: HEAD
  destination:
    server: "https://kubernetes.default.svc"
    namespace: mcp
  syncPolicy:
    automated:
      prune: false
      selfHeal: false
    syncOptions:
      # MCPServer/MCPOIDCConfig CRDs come from the toolhive app
      - SkipDryRunOnMissingResource=true
  info:
  - name: spreadsheet
    value: https://docs.google.com/spreadsheets/d/1_PTWIlWbpegK3lHIdnrErmH44gm9pFAnr88L4TuUwYI
