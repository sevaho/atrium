---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bookkeeping-credentials
  namespace: mcp
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-secret-store
    kind: ClusterSecretStore
  target:
    name: bookkeeping-credentials
  data:
    # Key JSON of a Google service account that has Editor on the spreadsheet
    # and Viewer on the invoices folder, nothing else.
    - secretKey: GOOGLE_SERVICE_ACCOUNT_JSON
      remoteRef:
        key: mcp/bookkeeping
        property: GOOGLE_SERVICE_ACCOUNT_JSON
    # LiteLLM virtual key for mistral-ocr, not the master key.
    - secretKey: LITELLM_API_KEY
      remoteRef:
        key: mcp/bookkeeping
        property: LITELLM_API_KEY
