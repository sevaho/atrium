---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: imap
  namespace: mcp
spec:
  image: ghcr.io/wh1isper/mcp-email-server:1.15.0
  transport: streamable-http
  args: [streamable-http]
  mcpPort: 9557
  proxyPort: 8080

  oidcConfigRef:
    name: imap-callers
    # Must be unique per server so a token for one server can't be replayed on another.
    audience: mcp-imap

  # Read-only tools only. email_command (raw protocol access) and every
  # send/organize/delete tool stay denied even if the server allowed them.
  authzConfig:
    type: inline
    inline:
      policies:
        - |
          permit(
            principal,
            action == Action::"call_tool",
            resource
          )
          when {
            resource in [
              Tool::"list_available_accounts",
              Tool::"list_mailboxes",
              Tool::"list_emails_metadata",
              Tool::"get_emails_content",
              Tool::"list_email_tags"
            ]
          };

  env:
    - name: MCP_HOST
      value: "0.0.0.0"
    - name: MCP_PORT
      value: "9557"
    # Only the ToolHive proxy talks to it, under an in-cluster host name.
    - name: MCP_ALLOWED_HOSTS
      value: "*"
    - name: MCP_EMAIL_SERVER_IMAP_HOST
      value: imap.migadu.com
    # No SMTP host: the server can't send. Empty mutations: read-only mailbox.
    - name: MCP_EMAIL_SERVER_ACCOUNT_ALLOWED_MUTATIONS
      value: ""
    - name: HOME
      value: /tmp
  secrets:
    - name: imap-credentials
      key: EMAIL_ADDRESS
      targetEnvName: MCP_EMAIL_SERVER_EMAIL_ADDRESS
    - name: imap-credentials
      key: EMAIL_PASSWORD
      targetEnvName: MCP_EMAIL_SERVER_PASSWORD

  resources:
    requests:
      cpu: 20m
      memory: 96Mi
    limits:
      memory: 256Mi

  podTemplateSpec:
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
