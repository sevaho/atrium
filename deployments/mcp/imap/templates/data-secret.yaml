---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: imap-credentials
  namespace: mcp
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-secret-store
    kind: ClusterSecretStore
  target:
    name: imap-credentials
  data:
    - secretKey: EMAIL_ADDRESS
      remoteRef:
        key: mcp/imap
        property: EMAIL_ADDRESS
    - secretKey: EMAIL_PASSWORD
      remoteRef:
        key: mcp/imap
        property: EMAIL_PASSWORD
