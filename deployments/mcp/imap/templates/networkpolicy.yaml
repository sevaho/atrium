---
# MCP pods accept traffic only from inside mcp (proxy -> server) and from agents.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: imap-callers
  namespace: mcp
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: imap
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: agents
