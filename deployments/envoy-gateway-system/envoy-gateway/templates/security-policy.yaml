---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: wg-only
  namespace: envoy-gateway-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: wg
  authorization:
    defaultAction: Deny
    rules:
      - name: wireguard-peers
        action: Allow
        principal:
          clientCIDRs:
            - 10.234.0.0/24
