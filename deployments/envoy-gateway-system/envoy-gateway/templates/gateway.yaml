---
# External IP inside the WireGuard subnet: DNS (*.wg.asic.li) and the wg0 rule point at it.
# externalTrafficPolicy Local stops kube-proxy from masquerading, so Envoy sees the peer's
# 10.234.0.x address and the SecurityPolicy can match on it.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: wg
  namespace: envoy-gateway-system
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        replicas: 2
      envoyService:
        type: ClusterIP
        # Set via patch: Envoy Gateway only applies envoyService.externalTrafficPolicy to LoadBalancer services.
        patch:
          type: StrategicMerge
          value:
            spec:
              externalTrafficPolicy: Local
              externalIPs:
                - 10.234.0.10
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy-wg
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: wg
    namespace: envoy-gateway-system
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: wg
  namespace: envoy-gateway-system
spec:
  gatewayClassName: envoy-wg
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.wg.asic.li"
      tls:
        certificateRefs:
          - name: wg-wildcard-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              wg-gateway: "true"
