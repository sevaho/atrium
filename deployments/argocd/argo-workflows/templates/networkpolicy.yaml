---
# authModes is "server" (no login), so the VPN is the only gate: only Envoy may reach it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: argo-workflows-server-from-envoy
  namespace: argocd
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: argo-workflows-server
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
