---
# ArgoCD is installed with helm (make up), not by Argo, so root applies this route directly.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: argocd
spec:
  parentRefs:
    - name: wg
      namespace: envoy-gateway-system
  hostnames:
    - cd.wg.asic.li
  rules:
    - backendRefs:
        - name: argocd-server
          port: 80
