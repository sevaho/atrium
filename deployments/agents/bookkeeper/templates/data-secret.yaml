---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bookkeeper-data-secret
  namespace: agents
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-secret-store
    kind: ClusterSecretStore
  target:
    name: bookkeeper-data-secret
  data:
    - secretKey: TELEGRAM_BOT_TOKEN
      remoteRef:
        key: agents/bookkeeper
        property: TELEGRAM_BOT_TOKEN
    # Comma-separated Telegram user ids that may talk to the bot.
    - secretKey: TELEGRAM_ALLOWED_USERS
      remoteRef:
        key: agents/bookkeeper
        property: TELEGRAM_ALLOWED_USERS
    # LiteLLM virtual key for this agent, not the master key.
    - secretKey: LITELLM_API_KEY
      remoteRef:
        key: agents/bookkeeper
        property: LITELLM_API_KEY
