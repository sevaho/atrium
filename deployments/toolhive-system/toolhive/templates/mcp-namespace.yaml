---
# Created here, before the operator chart adds its RoleBinding to it.
# Pod Security: enforce baseline, warn/audit restricted until the proxy and
# MCP pods are confirmed to pass restricted, then flip enforce.
apiVersion: v1
kind: Namespace
metadata:
  name: mcp
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
