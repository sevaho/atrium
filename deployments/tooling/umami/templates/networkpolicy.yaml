---
# Envoy (WireGuard gateway) for the admin UI, ingress-nginx for the public
# tracker paths (/x and /events, see ingress.yaml). Nothing else reaches Umami.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: umami-from-gateways
  namespace: tooling
spec:
  podSelector:
    matchLabels:
      app: umami
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: rke2-ingress-nginx
