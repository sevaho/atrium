---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pghero-data-secret
  namespace: tooling
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-secret-store
    kind: ClusterSecretStore
  target:
    name: pghero-data-secret
  data:
  - secretKey: DATABASE_URL
    remoteRef:
      key: tooling/pghero
      property: DATABASE_URL
