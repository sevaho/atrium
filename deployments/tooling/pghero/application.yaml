---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pghero
  namespace: argocd
spec:
  project: default
  source:
    path: deployments/tooling/pghero
    repoURL: 'https://github.com/sevaho/atrium'
    targetRevision: HEAD
    helm:
      releaseName: pghero
      valuesObject:
        application:
          nameOverride: pghero

          replicaCount: 1

          image:
            repository: cr.asic.li/dockercache/ankane/pghero
            tag: latest

          imagePullSecrets: [regcred]

          resources:
            limits:
              memory: 500Mi
            requests:
              memory: 100Mi

          service:
            type: ClusterIP
            port: 80
            targetPort: 8080

          envFrom:
            - secretRef:
                name: pghero-data-secret

  destination:
    server: "https://kubernetes.default.svc"
    namespace: tooling
  syncPolicy:
    automated:
      prune: false
      selfHeal: false
