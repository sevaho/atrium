---
# Only Envoy (WireGuard gateway) may reach Metabase, so a stray public Ingress or a
# compromised pod elsewhere in the cluster can't get to it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: metabase-from-envoy
  namespace: tooling
spec:
  podSelector:
    matchLabels:
      app: metabase
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
