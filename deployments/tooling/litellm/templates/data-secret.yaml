---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-data-secret
  namespace: tooling
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-secret-store
    kind: ClusterSecretStore
  target:
    name: litellm-data-secret
  data:
    - secretKey: username
      remoteRef:
        key: tooling/litellm
        property: DB_USERNAME
    - secretKey: password
      remoteRef:
        key: tooling/litellm
        property: DB_PASSWORD
    - secretKey: host
      remoteRef:
        key: tooling/litellm
        property: DB_HOST
    - secretKey: PROXY_MASTER_KEY
      remoteRef:
        key: tooling/litellm
        property: PROXY_MASTER_KEY
    # Encrypts credentials litellm stores in postgres. Never change it once set.
    - secretKey: LITELLM_SALT_KEY
      remoteRef:
        key: tooling/litellm
        property: LITELLM_SALT_KEY
    - secretKey: MISTRAL_API_KEY
      remoteRef:
        key: tooling/litellm
        property: MISTRAL_API_KEY
