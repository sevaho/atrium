---
# Only Envoy (WireGuard gateway), the agents and the bookkeeping MCP server may reach litellm.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: litellm-from-envoy
  namespace: tooling
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: litellm
      app.kubernetes.io/instance: litellm
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: agents
        # The bookkeeping MCP server, for mistral-ocr.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: mcp
          podSelector:
            matchLabels:
              toolhive-name: bookkeeping
