---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: litellm
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/sevaho/atrium
    path: deployments/tooling/litellm
    targetRevision: HEAD
    helm:
      releaseName: litellm
      valuesObject:
        litellm:
          replicaCount: 1
          service:
            type: ClusterIP
            port: 4000
          ingress:
            enabled: false
          masterkeySecretName: litellm-data-secret
          masterkeySecretKey: PROXY_MASTER_KEY
          environmentSecrets:
            - litellm-data-secret
          envVars:
            # Without this, invite and ui links are built on 0.0.0.0:4000.
            PROXY_BASE_URL: https://litellm.wg.asic.li
            # DOCS_URL defaults to /, so swagger takes the root. Move it and
            # send / to the ui.
            DOCS_URL: /docs
            ROOT_REDIRECT_URL: /ui
          db:
            useExisting: true
            deployStandalone: false
            database: litellm
            secret:
              name: litellm-data-secret
              usernameKey: username
              passwordKey: password
              endpointKey: host
          redis:
            enabled: false
          proxy_config:
            model_list:
              # Prices: USD per 1M tokens (input / output), from the Mistral model pages.
              - model_name: mistral-large
                # https://docs.mistral.ai/models/mistral-large-4-0
                # $0.70 / $2.10
                litellm_params:
                  model: mistral/mistral-large-4
                  api_key: os.environ/MISTRAL_API_KEY
              - model_name: mistral-medium
                # https://docs.mistral.ai/models/mistral-medium-3-5-26-04
                # $1.50 / $7.50
                litellm_params:
                  model: mistral/mistral-medium-3-5
                  api_key: os.environ/MISTRAL_API_KEY
              - model_name: mistral-small
                # https://docs.mistral.ai/models/mistral-small-4-0-26-03
                # $0.15 / $0.60
                litellm_params:
                  model: mistral/mistral-small-2603
                  api_key: os.environ/MISTRAL_API_KEY
              # Served on Mistral's /v1/ocr, not /v1/chat/completions.
              - model_name: mistral-ocr
                # https://docs.mistral.ai/models/ocr-4-1
                litellm_params:
                  model: mistral/mistral-ocr-latest
                  api_key: os.environ/MISTRAL_API_KEY
              - model_name: mistral-moderation
                # https://docs.mistral.ai/models/mistral-moderation-26-03
                # free
                litellm_params:
                  model: mistral/mistral-moderation-2603
                  api_key: os.environ/MISTRAL_API_KEY
              # Z.ai open-weight model hosted by Mistral, billed on the Mistral key.
              - model_name: glm-5.3
                # https://docs.mistral.ai/models/zai-glm-5-3
                # $1.40 / $4.40
                litellm_params:
                  model: mistral/zai-glm-5-3
                  api_key: os.environ/MISTRAL_API_KEY
              # DeepSeek open-weight model hosted by Mistral, billed on the Mistral key.
              # Public preview. The api id is not the doc slug (v4-1, not v4).
              - model_name: deepseek-v4.1-flash
                # https://docs.mistral.ai/models/deepseek-v4-flash-1017
                # $0.30 / $1.20
                litellm_params:
                  model: mistral/deepseek-v4-1-flash-1017
                  api_key: os.environ/MISTRAL_API_KEY
            general_settings:
              master_key: os.environ/PROXY_MASTER_KEY
              # Keep config.yaml the source of truth: with this on, the UI can
              # write models to the database and git stops matching reality.
              store_model_in_db: false
            litellm_settings:
              drop_params: true
              # Keep prompts and completions out of the spend logs in postgres.
              turn_off_message_logging: true

  destination:
    server: "https://kubernetes.default.svc"
    namespace: tooling
  syncPolicy:
    automated:
      prune: false
      selfHeal: false
  info:
    - name: releasenotes
      value: https://github.com/BerriAI/litellm/releases
    - name: values.yaml
      value: https://github.com/BerriAI/litellm/blob/main/deploy/charts/litellm-helm/values.yaml
