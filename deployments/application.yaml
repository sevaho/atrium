---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/sevaho/atrium
    path: deployments
    targetRevision: HEAD
    directory:
      recurse: true
      # Opt in one app at a time. Add a path here once its ${VAR} placeholders
      # are gone, its secrets come from Vault, and its chart version is pinned.
      # The first entry is this file: root manages itself, so changes to this
      # list deploy on push instead of needing a manual kubectl apply.
      include: '{application.yaml,tooling/external-secrets/application.yaml,redis/redis/application.yaml,tooling/reloader/application.yaml,kube-system/metrics-server/application.yaml,kube-system/kube-state-metrics/application.yaml,observability/prometheus/application.yaml,observability/gatus/application.yaml,nats/nats/application.yaml,observability/quickwit/application.yaml,observability/vector/application.yaml,envoy-gateway-system/envoy-gateway/application.yaml,tooling/litellm/application.yaml,toolhive-system/toolhive/application.yaml,mcp/imap/application.yaml,mcp/firefly/application.yaml,agents/hermes/application.yaml}'
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: false
      selfHeal: false
    syncOptions:
      - CreateNamespace=true
