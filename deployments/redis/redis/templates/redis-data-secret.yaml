---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: redis-data-secret
  namespace: redis
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-secret-store
    kind: ClusterSecretStore
  target:
    name: redis-data-secret
  data:
  - secretKey: redis-password
    remoteRef:
      key: redis/redis
      property: redis-password
