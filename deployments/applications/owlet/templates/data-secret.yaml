---
# Mounted as files, not env vars, so the login isn't inherited by every child process
# (go2rtc, ffmpeg, bash). The bridge never writes it, or the camera keys derived from it, to /config.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: owlet-data-secret
  namespace: applications
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-secret-store
    kind: ClusterSecretStore
  target:
    name: owlet-data-secret
  data:
    - secretKey: email
      remoteRef:
        key: applications/owlet
        property: OWLET_EMAIL
    - secretKey: password
      remoteRef:
        key: applications/owlet
        property: OWLET_PASSWORD
    - secretKey: camera-dsn
      remoteRef:
        key: applications/owlet
        property: OWLET_CAMERA_DSN
    - secretKey: camera-name
      remoteRef:
        key: applications/owlet
        property: OWLET_CAMERA_NAME
    - secretKey: region
      remoteRef:
        key: applications/owlet
        property: OWLET_REGION
