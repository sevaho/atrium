---
# Only the page, its player scripts, the video websocket and read-only vitals are exposed.
# The rest of go2rtc's API and the panel (which holds the Owlet login) stay internal.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: owlet
  namespace: applications
spec:
  parentRefs:
    - name: wg
      namespace: envoy-gateway-system
  hostnames:
    - {{ .Values.host }}
  rules:
    - matches:
        - path:
            type: Exact
            value: /api/vitals
          method: GET
      backendRefs:
        - name: owlet
          port: 8088
    - matches:
        - path:
            type: Exact
            value: /
        - path:
            type: Exact
            value: /video-stream.js
        - path:
            type: Exact
            value: /video-rtc.js
        # Only the camera alias; go2rtc would otherwise serve any src (overlay, spares, …)
        - path:
            type: Exact
            value: /api/ws
          queryParams:
            - type: Exact
              name: src
              value: camera
      backendRefs:
        - name: owlet
          port: 1984
