---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: firefly-iii
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/sevaho/atrium
    path: deployments/applications/firefly-iii
    targetRevision: HEAD
    helm:
      releaseName: firefly-iii
      valuesObject:
        firefly-iii:
          replicaCount: 1
          config:
            existingSecret: "firefly-data-secret"
            env:
              DB_CONNECTION: pgsql
              DB_PORT: "5432"
              DB_DATABASE: firefly
              DEFAULT_LANGUAGE: "en_US"
              DEFAULT_LOCALE: "equal"
              TZ: "Europe/Brussels"
              TRUSTED_PROXIES: "**"
              APP_URL: https://firefly.wg.asic.li
          ingress:
            enabled: true
            className: nginx
            hosts:
              - firefly.wg.asic.li
            annotations:
              cert-manager.io/cluster-issuer: letsencrypt-prod
              nginx.ingress.kubernetes.io/whitelist-source-range: 10.234.0.0/24
            tls:
              - secretName: firefly-tls
                hosts:
                  - firefly.wg.asic.li

        importer:
          fireflyiii:
            url: http://firefly-iii
            vanityUrl: https://firefly.wg.asic.li
            auth:
              existingSecret: firefly-importer-secret
          config:
            env:
              TZ: "Europe/Brussels"
            files: []
          ingress:
            enabled: true
            className: nginx
            hosts:
              - firefly-importer.wg.asic.li
            annotations:
              cert-manager.io/cluster-issuer: letsencrypt-prod
              nginx.ingress.kubernetes.io/whitelist-source-range: 10.234.0.0/24
            tls:
              - secretName: firefly-importer-tls
                hosts:
                  - firefly-importer.wg.asic.li

  destination:
    server: "https://kubernetes.default.svc"
    namespace: applications
  # The chart keeps APP_KEY via helm lookup, which Argo can't do, so every render generates a new key
  ignoreDifferences:
    - kind: Secret
      name: firefly-iii-app-key
      jsonPointers:
        - /data
  syncPolicy:
    syncOptions:
      - RespectIgnoreDifferences=true

  info:
  - name: releasenotes
    value: https://github.com/firefly-iii/firefly-iii/releases
  - name: values.yaml
    value: https://github.com/firefly-iii/kubernetes/blob/main/charts/firefly-iii/values.yaml
