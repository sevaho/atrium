[Interface]
Address = {{ wireguard_address }}
ListenPort = 51820
PostUp = wg set %i private-key /etc/wireguard/server.key
# Peers may only reach the Envoy gateway ClusterIP, nothing else on the host or cluster.
# raw table because canal's FORWARD rules accept before ufw ever sees the packet.
PostUp = iptables -t raw -I PREROUTING -i %i ! -d {{ wireguard_gateway_ip }} -j DROP
PreDown = iptables -t raw -D PREROUTING -i %i ! -d {{ wireguard_gateway_ip }} -j DROP

{% for peer in wireguard_peers %}
[Peer]
# {{ peer.name }}
PublicKey = {{ peer.public_key }}
AllowedIPs = {{ peer.address }}

{% endfor %}
